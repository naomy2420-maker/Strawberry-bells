<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Strawberry Bells</title>

    <link rel="stylesheet" href="diseño.css">

</head>


<body class="pagina-login">


    <!-- ==========================================
         ENCABEZADO
    =========================================== -->

    <header class="login-header">

        <a href="Strawberry bells.html">

            <img src="img/logo.png" alt="Strawberry Bells">

        </a>

    </header>



    <!-- ==========================================
         CONTENIDO INICIAR SESIÓN
    =========================================== -->

    <main class="login-contenedor">


        <div class="login-caja">


            <!-- LOGO -->

            <div class="login-logo">

                <img
                    src="img/logo.png"
                    alt="Strawberry Bells"
                >

            </div>


            <!-- TÍTULO -->

            <div class="login-titulo">

                <span>
                    STRAWBERRY BELLS
                </span>

                <h1>
                    Iniciar sesión
                </h1>

                <p>
                    Accede a tu plataforma agrícola
                    y consulta la información de tus cultivos.
                </p>

            </div>



            <!-- FORMULARIO -->

            <form class="login-form">


                <!-- CORREO -->

                <div class="login-campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Ingresa tu correo"
                        required
                    >

                </div>



                <!-- CONTRASEÑA -->

                <div class="login-campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>



                <!-- RECORDAR / RECUPERAR -->

                <div class="login-opciones">

                    <label>

                        <input
                            type="checkbox"
                            name="recordar"
                        >

                        Recordarme

                    </label>


                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>



                <!-- BOTÓN -->
<a
    href="plataforma.html"
    class="boton-login"
>
    Iniciar sesión
</a>


            </form>



            <!-- REGISTRO -->

            <div class="login-registro">

                <p>
                    ¿Aún no tienes una cuenta?
                </p>

                <a href="#">
                    Crear una cuenta
                </a>

            </div>



            <!-- VOLVER -->

            <a
                href="Strawberry bells.html"
                class="volver-inicio"
            >
                ← Volver al inicio
            </a>


        </div>


    </main>


</body>

</html>
